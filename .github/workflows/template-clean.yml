# Maintainer CI for the TEMPLATE repo only — two checks:
#   template-clean  — no project-shell artifacts tracked (maintainers/check-template-clean.sh)
#   core-tests   — all bash suites in .claude/tests/
#
# Both jobs are pinned to the canonical template repo, so this workflow is inert
# (skipped, not red) in forks and "Use this template" copies. Consumers can also
# simply delete this file — nothing else references it.
#
# Maintainers: if this repo is ever renamed or transferred, dual-pin both `if:`
# lines (old slug || new slug) BEFORE the rename, then collapse to the new slug
# once CI has run green under the new name — otherwise the guard silently stops
# running (jobs show "skipped" in the canonical repo too). Done once already:
# the Phase 5 D3 rename (claude-code-sandbox → guv) dual-pinned, PR #9's runs
# proved the new slug live, and the pin collapsed to 'ijpatter1/guv' alone.
name: maintainer-ci

on:
  pull_request:
  push:
    branches: [main]
    # Tags too, for the release-artifact job below — the checked-in plugin/ is only
    # required to match source at a release, so that is the only ref where the
    # check can run without contradicting the [32.5] model.
    tags: ['v*']

jobs:
  template-clean:
    if: github.repository == 'ijpatter1/guv'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Template carries no project-shell artifacts
        run: bash maintainers/check-template-clean.sh

  core-tests:
    if: github.repository == 'ijpatter1/guv'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run all bash test suites
        run: |
          # The same gate the generated run-core-tests.sh enforces ([15.1]): a
          # suite fails the run on ANY of nonzero rc, ANY stderr byte, OR a
          # failure-shaped stdout verdict (a green summary above a parse error,
          # or a suite that reported its own failure on stdout but forgot to exit
          # nonzero, is how a vacuous guard slipped two review gates — see
          # maintainers/RELEASING.md, checklist step 1). Each suite runs under a
          # per-suite timeout so a hang fails LOUD with a named timeout, never a
          # silent stall (Rule 15). Serial here by design — the CI reference is
          # the simple form; the local battery adds a bounded parallel pool plus a
          # HERMETICITY GUARD (audit: maintainers/BATTERY-HERMETICITY.md): it
          # fingerprints the code repo before the first suite and again after the
          # last, and fails the run if the SHARED LIVE SOURCE TREE moved. That
          # guard is what makes the pool sound. It took over the SAFETY argument
          # from an earlier serial carve of plugin.test.sh + ship-suite.test.sh,
          # but did not remove the carve: those two still run one-at-a-time locally
          # for a separate, measured SCHEDULING reason (folding them into a
          # saturated pool inflated every other suite ~48% — see the audit doc).
          #
          # Be precise about what serial buys here — the two properties are NOT the
          # same. Serial execution SUBSUMES the CARVE, which is only about
          # non-overlap: run alone, nothing can collide. It does NOT subsume
          # HERMETICITY — a suite that writes the live tree still writes it when run
          # alone; this loop simply never notices. So CI is safe from the collision
          # flake class but verifies nothing about hermeticity, and the local
          # battery is where that property is actually enforced. A future parallel
          # CI form would have to carry the fingerprint guard itself; globbing all
          # suites concurrently without it reopens the flake class.
          # One plugin build for the whole loop ([32.5]), exported exactly as the
          # local runner does. Two reasons this is not optional: the six suites
          # that verify build output would otherwise each pay their own build,
          # and — more importantly — CI and the local battery would exercise
          # DIFFERENT code paths in those suites. The feedback-log fork-probe
          # defect this deliverable fixed reproduced only when the shared tree
          # was set; a CI that never sets it is blind to that whole class.
          if [ -f maintainers/build-plugin.sh ]; then
            if bash maintainers/build-plugin.sh --out "$RUNNER_TEMP/built-plugin" >/dev/null 2>&1; then
              export GUV_BUILT_PLUGIN="$RUNNER_TEMP/built-plugin"
            else
              echo "[ci] shared plugin build FAILED — suites needing one will build their own"
            fi
          fi

          fail=0
          for t in .claude/tests/*.test.sh; do
            b="$(basename "$t")"
            echo "== $b =="
            err=$(mktemp); out=$(mktemp)
            timeout -k 5 300 bash "$t" >"$out" 2>"$err"; rc=$?
            cat "$out"
            if [ "$rc" = "124" ] || [ "$rc" = "137" ]; then
              echo "[timeout] $b TIMED OUT after 300s (rc=$rc) — failing the run (a hang, not slowness)"
              fail=1
            elif [ "$rc" != "0" ]; then
              fail=1
            fi
            if [ -s "$err" ]; then
              echo "[stderr] $b wrote to stderr — failing the run:"
              cat "$err"
              fail=1
            fi
            if grep -q '✗' "$out" \
               || grep -qE 'Results:[[:space:]]*[0-9]+[[:space:]]*passed,[[:space:]]*[1-9][0-9]*[[:space:]]*failed' "$out"; then
              echo "[stdout] $b reported a FAILURE on stdout while exit was $rc — failing the run"
              fail=1
            fi
            rm -f "$err" "$out"
          done
          exit "$fail"

  # The machine backstop for the release artifact ([32.5]). The continuous
  # byte-identity guard retired from the battery when plugin/ became the frozen
  # release artifact, and its replacement — build-plugin.sh --check — is a step in
  # a human checklist. On a release-tag push that is not enough: the marketplace
  # serves plugin/ from the default branch, so an artifact nobody diffed reaches
  # consumers. This job runs the check exactly where staleness matters and nowhere
  # else, so ordinary PRs keep the source-ahead-of-artifact freedom the model grants.
  release-artifact:
    if: github.repository == 'ijpatter1/guv' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Committed plugin/ matches a build of this tag
        run: bash maintainers/build-plugin.sh --check
